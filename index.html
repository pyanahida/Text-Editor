<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Editor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/icon.png">
</head>
<body>
  <main class="editor">
    <h1>Text Editor</h1>
    <p class="intro">Type anything in the box below, then press Save to download it as a text file.</p>
    <textarea id="editor" placeholder="Start typing here..." spellcheck="false"></textarea>
    <div class="actions">
      <button id="save-button" type="button">Save</button>
      <span id="status" class="status"></span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
